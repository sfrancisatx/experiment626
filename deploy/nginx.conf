# Nginx configuration for Experiment626
# Place this in /etc/nginx/sites-available/experiment626
# Then: sudo ln -s /etc/nginx/sites-available/experiment626 /etc/nginx/sites-enabled/
# Remove default: sudo rm /etc/nginx/sites-enabled/default

server {
    listen 80;
    server_name _;  # Replace with your domain when you have one

    # Root directory for static files
    root /var/www/experiment626;
    index index.html;

    # Serve static files (client)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Increase timeouts for WebSocket connections
    proxy_connect_timeout 7d;
    proxy_send_timeout 7d;
    proxy_read_timeout 7d;

    # Proxy API and WebSocket traffic to Colyseus server
    location ~ ^/(matchmake|monitor|playground|hello_world) {
        proxy_pass http://localhost:5111;
        proxy_http_version 1.1;
        
        # WebSocket support
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        
        # Standard proxy headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Disable buffering for WebSocket
        proxy_buffering off;
    }
}
