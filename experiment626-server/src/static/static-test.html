<!DOCTYPE html>
<html>
  <head>
    <meta name="viewport" content="width=device-width" />

    <style>
      body { font-family: Tahoma, Geneva, sans-serif; }
    </style>

    <!-- colyseus.js client -->
    <script type="text/javascript" src="https://unpkg.com/colyseus.js@^0.16.0/dist/colyseus.js"></script>
<!-- comment : this file is just so that we have some ability to have a static web page driving the app for testing purpsoes etc.  -->

  </head>
  <body>
    <h1>
      Static HTML Test Bed
    </h1>

    <p>Scott's attempt at a lobby:</p>

    <p><strong>Commands</strong></p>

    <button onclick="join()">join lobby</button>
    <button onclick="leave()">leave lobby</button>

    <h2>All rooms:</h2>
    <ul id="all_rooms"></ul>

    <script> 

      // SLF : now , all of this needs to get rewritten to reflect whatever WE want to test. 
      var host = window.document.location.host.replace(/:.*/, '');
      var client = new Colyseus.Client(location.protocol.replace("http", "ws") + "//" + host + (location.port ? ':' + location.port : ''));
      var lobby;

      function join () {
        console.log("inside join()");
        client.joinOrCreate("my_room").then(room_instance => {
            lobby = room_instance;
            console.log(lobby.serializer);
            onjoin();
            console.log("Joined lobby room!");

        }).catch(e => {
            console.error("Error", e);
        });
      }

      function onjoin() {
          lobby.onStateChange((state) => {
              console.log("Custom lobby state:", state);
          })

          lobby.onMessage("rooms", (rooms) => {
              allRooms = rooms;
              update_full_list();

              console.log("Received full list of rooms:", allRooms);
          });

          lobby.onMessage("+", ([roomId, room]) => {
              const roomIndex = allRooms.findIndex((room) => room.roomId === roomId);
              if (roomIndex !== -1) {
                  console.log("Room update:", room);
                  allRooms[roomIndex] = room;

              } else {
                  console.log("New room", room);
                  allRooms.push(room);
              }
              update_full_list();
          });

          lobby.onMessage("-", (roomId) => {
              console.log("Room removed", roomId);
              allRooms = allRooms.filter((room) => room.roomId !== roomId);
              update_full_list();
          });

          lobby.onLeave(() => {
              allRooms = [];
              update_full_list();
              console.log("Bye, bye!");
          });
      }

      function update_full_list() {
        var el = document.getElementById('all_rooms');
        el.innerHTML = allRooms.map(function(room) {
            return "<li><code>" + JSON.stringify(room) + "</code></li>";
        }).join("\n");

      }

      function leave() {
        if (lobby) {
          lobby.leave();

        } else {
          console.warn("Not connected.");
        }
      }
    </script>

  </body>
</html>
