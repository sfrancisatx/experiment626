<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Vite + TS</title>
  </head>
  <body>
    <div id="tooltip" style="
    position: absolute;
    pointer-events: none;
    background: rgba(0, 0, 0, 0.7);
    color: white;
    padding: 4px 8px;
    font-size: 12px;
    border-radius: 4px;
    font-family: sans-serif;
    z-index: 1000;
    display: none;
    transition: opacity 0.2s ease-in-out;
    opacity: 0;
    "></div>
    <div id="app">
      <div id="status">🔌 Connecting...</div>

      <div id="commandPanel" style="margin-top: 1rem;">
        <label for="commandSelect">Choose command:</label>
        <select id="commandSelect">
          <option value="">--Select a command--</option>
        </select>
      
        <div id="commandInputs" style="margin-top: 0.5rem;"></div>
        <button id="sendCommandButton">Send Command</button>
      </div>

      <div style="margin-top: 1rem;">
        <input id="messageInput" type="text" placeholder="Type a message..." />
        <button id="sendButton">Send</button>
      </div>

      <ul id="messages" style="margin-top: 1rem; list-style: none; padding-left: 0;"></ul>

      <!-- 🗺️ Emoji map and 🧪 Debug panel side-by-side -->
      <div style="display: flex; margin-top: 1rem; gap: 0.5rem;">
        <!-- Emoji map -->
        <div id="mapDisplay" style="width: 800px; height: 800px; border: 1px solid #ccc;"></div>
      
        <!-- Debug panel 1 -->
        <div
          id="debugPanel1"
          style="display: none; width: 140px; height: 800px; overflow: auto; border: 1px solid #ccc;"
        >
          <pre
            id="debugDisplay1"
            style="font-size: 12px; line-height: 1.2; font-family: monospace; white-space: pre-wrap; margin: 0; padding: 0.5rem;"
          ></pre>
        </div>
      
        <!-- Debug panel 2 -->
        <div
          id="debugPanel2"
          style="display: none; width: 200px; height: 800px; overflow: auto; border: 1px solid #ccc;"
        >
          <pre
            id="debugDisplay2"
            style="font-size: 12px; line-height: 1.2; font-family: monospace; white-space: pre-wrap; margin: 0; padding: 0.5rem;"
          ></pre>
        </div>
      
        <!-- Debug panel 3 -->
        <div
          id="debugPanel3"
          style="display: none; width: 170px; height: 800px; overflow: auto; border: 1px solid #ccc;"
        >
          <pre
            id="debugDisplay3"
            style="font-size: 12px; line-height: 1.2; font-family: monospace; white-space: pre-wrap; margin: 0; padding: 0.5rem;"
          ></pre>
        </div>
      </div>
    </div>
    
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
