<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Nova</title>
    <style>
      @keyframes spin {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
    </style>
  </head>
  <body style="margin: 0; padding: 0; overflow: auto;">
    <div id="tooltip" style="
    position: absolute;
    pointer-events: none;
    background: rgba(0, 0, 0, 0.7);
    color: white;
    padding: 4px 8px;
    font-size: 12px;
    border-radius: 4px;
    font-family: sans-serif;
    z-index: 1000;
    display: none;
    transition: opacity 0.2s ease-in-out;
    opacity: 0;
    "></div>
    <div id="app">
      <!-- Initial Loading Screen -->
      <div id="loading-ui" style="overflow: hidden; padding: 0; z-index: 0; inset: 0; position: fixed; display: flex; flex-direction: column; justify-content: center; align-items: center; background: #2a2a2a;">
        <div style="text-align: center; color: white;">
          <div style="width: 40px; height: 40px; border: 4px solid #333; border-top: 4px solid #667eea; border-radius: 50%; animation: spin 1s linear infinite; margin: 0 auto 1rem;"></div>
          <p style="font-family: sans-serif; opacity: 0.8;">Loading...</p>
        </div>
      </div>

      <!-- Startup UI State -->
      <div id="startup-ui" style="overflow: hidden; padding: 0; z-index: 0; inset: 0; position: fixed; display: none; flex-direction: column; justify-content: center; align-items: center; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);">
        <div style="text-align: center; color: white;">
          <h1 style="font-size: 3rem; margin-bottom: 0.5rem; font-family: sans-serif; text-shadow: 2px 2px 4px rgba(0,0,0,0.3);">Nova</h1>
          <p style="font-size: 1.2rem; margin-bottom: 2rem; font-family: sans-serif; opacity: 0.9;">Galactic Strategy Game</p>
          <div id="status-startup" style="background: rgba(255, 255, 255, 0.1); padding: 1rem 2rem; border-radius: 10px; backdrop-filter: blur(10px); margin-bottom: 2rem;">
            🔌 Connecting...
          </div>
          
          <!-- Property Modules Grid -->
          <div id="property-modules" style="display: grid; grid-template-columns: repeat(2, 1fr); gap: 1rem; margin-bottom: 2rem; width: fit-content; margin-left: auto; margin-right: auto;">
            <!-- Modules will be generated by JavaScript -->
          </div>
          
          <style>
            .property-module {
              background: rgba(255, 255, 255, 0.15);
              padding: 1rem;
              border-radius: 10px;
              backdrop-filter: blur(10px);
              border: 1px solid rgba(255, 255, 255, 0.2);
            }
            .property-module-title {
              font-size: 1rem;
              font-family: sans-serif;
              margin-bottom: 0.5rem;
              opacity: 0.9;
              font-weight: bold;
            }
            .property-module-value {
              font-size: 1.5rem;
              font-weight: bold;
              font-family: sans-serif;
              margin-bottom: 0.5rem;
              cursor: pointer;
              padding: 0.25rem 0.5rem;
              border-radius: 5px;
              transition: background 0.2s ease;
              display: inline-block;
              min-width: 60px;
              text-align: center;
            }
            .property-module-value:hover {
              background: rgba(255, 255, 255, 0.2);
            }
            .property-module-value:focus {
              outline: none;
              background: rgba(255, 255, 255, 0.3);
            }
            .property-module-slider {
              width: 100%;
              cursor: pointer;
            }
          </style>
          
          <button id="startGameBtn" style="background: rgba(255, 255, 255, 0.2); color: white; border: 2px solid rgba(255, 255, 255, 0.3); padding: 1rem 2rem; border-radius: 10px; backdrop-filter: blur(10px); font-size: 1.1rem; cursor: pointer; transition: all 0.3s ease; margin-bottom: 2rem; display: none; width: fit-content; margin-left: auto; margin-right: auto;">
            Initialize Game
          </button>
          <div id="waiting-message" style="background: rgba(255, 255, 255, 0.1); padding: 1rem 2rem; border-radius: 10px; backdrop-filter: blur(10px); display: none;">
            Waiting for game to be initialized...
          </div>
        </div>
      </div>

      <!-- Game UI State -->
      <div id="game-ui" style="overflow: hidden; padding: 0; z-index: 0; inset: 0; position: fixed; display: none;">
        <div id="pixi-root" style="overflow: hidden; padding: 0; z-index: 0; inset: 0; position: fixed;">
          <div id="pixi-ui-root" style="z-index: 10; inset: 0; position: fixed; pointer-events: none">
            <div style="background: rgba(255, 255, 255, 0.85); padding: 10px; border-radius: 5px; width: fit-content; box-shadow: 0 2px 8px rgba(255,255,255,0.5); margin: 10px;">
              <div id="status">🔌 Connecting...</div>
              <div id="commandPanel" style="margin-top: 1rem; pointer-events: auto;">
                <label for="commandSelect">Choose command:</label>
                <select id="commandSelect">
                  <option value="">--Select a command--</option>
                </select>
              
                <div id="commandInputs" style="margin-top: 0.5rem; pointer-events: auto;"></div>
                <button id="sendCommandButton">Send Command</button>
              </div>
              <div style="margin-top: 1rem; pointer-events: auto;">
                <input id="messageInput" type="text" placeholder="Type a message..." />
                <button id="sendButton">Send</button>
              </div>
            </div>

            <!-- <ul id="messages" style="margin-top: 1rem; list-style: none; padding-left: 0;"></ul> -->

            <!-- 🗺️ Emoji map and 🧪 Debug panel side-by-side -->
            <div style="display: flex; margin-top: 1rem; gap: 0.5rem;;">
              <!-- Debug panel 1 -->
              <div
                id="debugPanel1"
                style="display: none; width: 140px; height: 800px; overflow: auto; border: 1px solid #ccc;"
              >
                <pre
                  id="debugDisplay1"
                  style="font-size: 12px; line-height: 1.2; font-family: monospace; white-space: pre-wrap; margin: 0; padding: 0.5rem;"
                ></pre>
              </div>
            
              <!-- Debug panel 2 -->
              <div
                id="debugPanel2"
                style="display: none; width: 200px; height: 800px; overflow: auto; border: 1px solid #ccc;"
              >
                <pre
                  id="debugDisplay2"
                  style="font-size: 12px; line-height: 1.2; font-family: monospace; white-space: pre-wrap; margin: 0; padding: 0.5rem;"
                ></pre>
              </div>
            
              <!-- Debug panel 3 -->
              <div
                id="debugPanel3"
                style="display: none; width: 170px; height: 800px; overflow: auto; border: 1px solid #ccc;"
              >
                <pre
                  id="debugDisplay3"
                  style="font-size: 12px; line-height: 1.2; font-family: monospace; white-space: pre-wrap; margin: 0; padding: 0.5rem;"
                ></pre>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
    
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
