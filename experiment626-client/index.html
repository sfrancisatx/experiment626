<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Vite + TS</title>
  </head>
  <body>
    <div id="app">
      <div id="status">🔌 Connecting...</div>

      <div style="margin-top: 1rem;">
        <input id="messageInput" type="text" placeholder="Type a message..." />
        <button id="sendButton">Send</button>
      </div>

      <ul id="messages" style="margin-top: 1rem; list-style: none; padding-left: 0;"></ul>

      <!-- 🗺️ Emoji map display -->
      <div
        style="margin-top: 1rem; width: 1000px; height: 500px; overflow: auto; border: 1px solid #ccc;"
      >
        <pre
          id="mapDisplay"
          style="font-size: 2px; line-height: 1; font-family: monospace; white-space: pre; margin: 0;"
        ></pre>
      </div>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
